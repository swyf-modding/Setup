# Unity Doorstop 4.5.0 - preconfigured for Scam With Your Friends
#
# Installed by scam-wyf-setup. The one line that matters on this game is
# dll_search_path_override at the bottom: this build ships a stripped mscorlib,
# and BepInEx cannot load without the unstripped one. Managed\ is still searched
# afterwards, so everything else the game needs resolves normally.
#
# Original file: doorstop_config.ini from the BepInEx 5.4.23.5 x64 pack.

[General]
enabled = true
target_assembly=BepInEx\core\BepInEx.Preloader.dll
redirect_output_log = false
boot_config_override =
ignore_disable_switch = false

[UnityMono]

# Points Mono at the unstripped BCL before it looks in Managed\.
# vendor\corlib in this repo is seeded into unstripped_corlib\ by setup.ps1.
dll_search_path_override=unstripped_corlib

debug_enabled = false
debug_address = 127.0.0.1:10000
debug_suspend = false